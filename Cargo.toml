[package]
name = "rusty_clean"
version = "0.3.2"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
fs_extra = "1.3.0"
ratatui = "0.30.0"


[[bin]]
name="rusty_clean"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
